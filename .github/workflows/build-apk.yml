name: Build release APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths-ignore:
      - 'cyber_hayat_pk.apk'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk cyber_hayat_pk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cyber_hayat_pk
          path: cyber_hayat_pk.apk
      - name: Commit APK to branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cyber_hayat_pk.apk
          git diff --cached --quiet && echo "no apk change" && exit 0
          git commit -m "Add release APK (CI)"
          git push
