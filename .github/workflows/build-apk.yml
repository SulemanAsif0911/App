name: Build release APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk cyber_hayat_pk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cyber_hayat_pk
          path: cyber_hayat_pk.apk
