name: Build release APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - run: flutter pub get
      - run: flutter doctor -v
      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true
      - run: flutter test
      - name: Build APK
        run: |
          set +e
          flutter build apk --release > apk_build.log 2>&1
          status=$?
          tail -n 40 apk_build.log
          tail -n 15 apk_build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $status
      - run: cp build/app/outputs/flutter-apk/app-release.apk cyber_hayat_pk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cyber_hayat_pk
          path: cyber_hayat_pk.apk
